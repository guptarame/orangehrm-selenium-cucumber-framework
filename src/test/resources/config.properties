# --------------------------------------------------------------------------
# Environment configuration for the OrangeHRM Selenium Cucumber framework.
# Values can be overridden at runtime with -Dkey=value (see ConfigReader).
# --------------------------------------------------------------------------

# Application under test
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# Browser: chrome | firefox | edge
browser=chrome

# Run browser without a visible UI window (true|false)
headless=false

# Explicit/implicit wait timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30

# Valid credentials used by the positive login scenario.
# NOTE: these are OrangeHRM's own public opensource-demo values (demo-only,
# not a secret). Before pointing this framework at any non-public
# environment, remove the plaintext values below and supply real credentials
# only via -Dvalid.username=... -Dvalid.password=... (or CI secret
# injection into those same system properties) - ConfigReader.get() already
# gives a non-empty -D value priority over this file, so no code change is
# needed to externalize these.
valid.username=Admin
valid.password=admin123
